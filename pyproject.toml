[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codestra-face-liveness"
version = "0.4.0"
description = "Standalone passive face liveness / presentation-attack-detection service"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<6",
  "onnxruntime>=1.19,<2",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6"]

[project.scripts]
face-liveness = "face_liveness.main:main"
face-liveness-calibrate = "face_liveness.calibration:main"
face-liveness-models = "face_liveness.promotion:main"
face-liveness-benchmark = "face_liveness.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["models: requires real model artifacts in LIVENESS_MODEL_DIR"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"tools/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["face_liveness"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
