# Local development / integration path. Production routing is
# Caller -> Caddy -> Kong -> Middleware V3 -> this service; nothing here is public.
services:
  face-liveness:
    build: .
    image: codestra/face-liveness:dev
    env_file:
      - path: .env
        required: false
    environment:
      LIVENESS_ENV: ${LIVENESS_ENV:-development}
      LIVENESS_LOG_LEVEL: ${LIVENESS_LOG_LEVEL:-INFO}
      # Token is mounted as a file (in production, rendered by an OpenBao agent).
      LIVENESS_API_TOKEN_FILE: /run/secrets/liveness_api_token
      LIVENESS_REQUIRE_AUTH: ${LIVENESS_REQUIRE_AUTH:-false}
    secrets:
      - liveness_api_token
    ports:
      - "127.0.0.1:${LIVENESS_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    restart: unless-stopped

secrets:
  liveness_api_token:
    # Create locally: mkdir -p secrets && openssl rand -hex 32 > secrets/liveness_api_token
    file: ./secrets/liveness_api_token
