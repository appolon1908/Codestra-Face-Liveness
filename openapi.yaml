    LivenessCheckRequest:
      properties:
        image_base64:
          type: string
          minLength: 1
          title: Image Base64
          description: Standard base64 of a JPEG, PNG or WebP image containing exactly one face. A `data:image/...;base64,`
            prefix is tolerated. The image is processed in memory only and is never persisted.
        mode:
          type: string
          const: passive_single_image
          title: Mode
          description: Liveness method. Only passive single-image PAD is implemented.
          default: passive_single_image
        active_frames_base64:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 32
            minItems: 1
          - type: 'null'
          title: Active Frames Base64
          description: 'Active-liveness capture: frames recorded while the user followed the challenge
            instructions (same encoding and limits as `image_base64`, at most `capabilities.active.max_frames`).
            Only accepted on challenge verify, and only when `capabilities.active.available` is true;
            otherwise the request fails closed with `EVIDENCE_UNAVAILABLE`. No active provider is installed
            today, so this must be omitted.'
      additionalProperties: false
      type: object
      required:
      - image_base64
      title: LivenessCheckRequest
    LivenessCheckResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        decision:
          $ref: '#/components/schemas/Decision'
          description: '`live` only if live_score >= threshold; otherwise `spoof`.'
        is_live:
          type: boolean
          title: Is Live
        live_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Live Score
          description: Ensemble-mean probability of a bona fide (live) face.
        threshold:
          type: number
          title: Threshold
        method:
          type: string
          const: passive_single_image
          title: Method
        face:
          $ref: '#/components/schemas/FaceRegion'
        faces_detected:
          type: integer
          title: Faces Detected
        components:
          items:
            $ref: '#/components/schemas/ComponentScoreOut'
          type: array
          title: Components
        model:
          $ref: '#/components/schemas/ModelRef'
        image:
          $ref: '#/components/schemas/ImageInfo'
        processing_ms:
          type: number
          title: Processing Ms
        image_persisted:
          type: boolean
          const: false
          title: Image Persisted
          default: false
        evidence:
          $ref: '#/components/schemas/DecisionEvidence'
      type: object
      required:
      - request_id
      - decision
      - is_live
      - live_score
      - threshold
      - method
      - face
      - faces_detected
      - components
      - model
      - image
      - processing_ms
      - evidence
      title: LivenessCheckResponse
