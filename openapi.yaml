openapi: 3.1.0
info:
  title: Codestra Face Liveness API
  description: 'Standalone passive presentation-attack-detection (PAD) service for Codestra FACE-ID. It
    answers one question: is the single face in this image a bona fide live capture or a presentation
    attack (print, screen replay, mask)? It does NOT perform face matching or identity verification, and
    it does NOT perform active (challenge-response) liveness: challenges are freshness / replay nonces
    only and the passive model decision is authoritative. The only supported caller is Middleware V3,
    which owns authentication normalisation, policy, orchestration and cross-system audit. Images are
    processed in memory and never persisted.'
  version: 0.4.0
servers:
- url: http://localhost:8080
  description: Local development
paths:
  /healthz:
    get:
      tags:
      - operations
      summary: Healthz
      description: Liveness of the process itself. Does not check the model.
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags:
      - operations
      summary: Readyz
      description: Ready only when models are loaded + digest-verified and auth is configured.
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not ready (fail closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /health/ready:
    get:
      tags:
      - operations
      summary: Readyz
      description: Ready only when models are loaded + digest-verified and auth is configured.
      operationId: healthReadyAlias
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /metrics:
    get:
      tags:
      - operations
      summary: Prometheus Metrics
      description: Prometheus metrics in text exposition format.
      operationId: metrics
      responses:
        '200':
          description: Prometheus exposition
          content:
            text/plain: {}
  /v1/capabilities:
    get:
      tags:
      - liveness
      summary: Capabilities
      description: What this service can and cannot do, its limits, and its decision policy.
      operationId: capabilities
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/liveness/status:
    get:
      tags:
      - liveness
      summary: Status
      description: Service-local status summary.
      operationId: serviceStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/models:
    get:
      tags:
      - models
      summary: List Models
      description: 'Installed model versions, their validation status, and which one is active.


        Read-only: the registry is built and verified at startup. Changing the active

        version is a deployment action (`LIVENESS_ACTIVE_MODEL_VERSION`), not an API call.'
      operationId: listModels
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegistryResponse'
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/models/{version}:
    get:
      tags:
      - models
      summary: Get Model
      description: One installed model version.
      operationId: getModel
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionOut'
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Error codes: NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/liveness/challenges:
    post:
      tags:
      - liveness
      summary: Issue Challenge
      description: 'Issue a short-lived, single-use challenge.


        Today this is a freshness / replay-prevention nonce only: no tested active

        provider is installed, so it has no instructions and does not make the check

        *active* liveness. Verify it with `POST /v1/liveness/challenges/{challenge_id}/verify`;

        the configured fusion policy (default `passive-only.v1`) decides.'
      operationId: issueChallenge
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssueResponse'
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Error codes: BUSY'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/liveness/check:
    post:
      tags:
      - liveness
      summary: Check Liveness
      description: 'Passive single-image liveness check.


        A `200` response is a completed assessment: `decision` is `live` or `spoof`.

        Any non-2xx response means **no assessment was made** and the caller must treat

        the subject as not verified (fail closed). `spoof` is a normal 200 outcome, not

        an error.'
      operationId: checkLiveness
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivenessCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessCheckResponse'
        '400':
          description: 'Error codes: INVALID_REQUEST'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 'Error codes: PAYLOAD_TOO_LARGE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'Error codes: UNSUPPORTED_MEDIA_TYPE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Error codes: INVALID_IMAGE, IMAGE_TOO_SMALL, NO_FACE, MULTIPLE_FACES, FACE_TOO_SMALL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Error codes: INTERNAL_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Error codes: MODEL_UNAVAILABLE, BUSY, DEADLINE_EXCEEDED, EVIDENCE_UNAVAILABLE,
            INFERENCE_FAILED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/liveness/challenges/{challenge_id}/verify:
    post:
      tags:
      - liveness
      summary: Verify Challenge
      description: 'Consume a challenge and run the passive check on the submitted capture.


        The challenge is spent by the first verify attempt whatever its outcome (issue a

        new one to retry). Unknown, expired or already-used challenges fail closed with

        no assessment. A `200` carries the same passive decision as `/v1/liveness/check`

        plus `evidence.challenge`. `active_frames_base64` is only accepted when a tested

        active provider is available (none is installed today, so it fails closed with

        `EVIDENCE_UNAVAILABLE`); `active_liveness_evaluated` is false without it.'
      operationId: verifyChallenge
      parameters:
      - name: challenge_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
          title: Challenge Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivenessCheckRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessCheckResponse'
        '400':
          description: 'Error codes: INVALID_REQUEST'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Error codes: UNAUTHORIZED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Error codes: CHALLENGE_NOT_FOUND'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Error codes: CHALLENGE_ALREADY_USED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 'Error codes: CHALLENGE_EXPIRED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 'Error codes: PAYLOAD_TOO_LARGE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'Error codes: UNSUPPORTED_MEDIA_TYPE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Error codes: INVALID_IMAGE, IMAGE_TOO_SMALL, NO_FACE, MULTIPLE_FACES, FACE_TOO_SMALL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Error codes: INTERNAL_ERROR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Error codes: MODEL_UNAVAILABLE, BUSY, DEADLINE_EXCEEDED, EVIDENCE_UNAVAILABLE,
            INFERENCE_FAILED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ActiveEvidence:
      properties:
        provider_id:
          type: string
          title: Provider Id
        provider_version:
          type: string
          title: Provider Version
        outcome:
          $ref: '#/components/schemas/ActiveOutcome'
        score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Score
      type: object
      required:
      - provider_id
      - provider_version
      - outcome
      - score
      title: ActiveEvidence
    ActiveLivenessInfo:
      properties:
        contract_version:
          type: string
          const: active-provider.v1
          title: Contract Version
          default: active-provider.v1
        available:
          type: boolean
          title: Available
          description: True only if a provider is configured, ready, and names the validation report that
            tested it. No provider ships with this service.
        configured_provider_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Configured Provider Id
        provider:
          anyOf:
          - $ref: '#/components/schemas/ActiveProviderOut'
          - type: 'null'
        max_frames:
          type: integer
          title: Max Frames
          description: Upper bound on `active_frames_base64` entries.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why active liveness is unavailable.
      type: object
      required:
      - available
      - configured_provider_id
      - provider
      - max_frames
      - reason
      title: ActiveLivenessInfo
      description: Pluggable active (challenge-response) provider slot. Empty today.
    ActiveOutcome:
      type: string
      enum:
      - pass
      - fail
      title: ActiveOutcome
    ActiveProviderOut:
      properties:
        provider_id:
          type: string
          title: Provider Id
        version:
          type: string
          title: Version
        contract_version:
          type: string
          title: Contract Version
        validation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation Id
          description: PAD evaluation that tested this provider.
      type: object
      required:
      - provider_id
      - version
      - contract_version
      - validation_id
      title: ActiveProviderOut
    ArtifactOut:
      properties:
        name:
          type: string
          title: Name
        file:
          type: string
          title: File
        sha256:
          type: string
          title: Sha256
      type: object
      required:
      - name
      - file
      - sha256
      title: ArtifactOut
    CapabilitiesResponse:
      properties:
        service:
          type: string
          title: Service
        version:
          type: string
          title: Version
        api_version:
          type: string
          const: v1
          title: Api Version
          default: v1
        ready:
          type: boolean
          title: Ready
        methods:
          items:
            $ref: '#/components/schemas/MethodInfo'
          type: array
          title: Methods
        unsupported:
          items:
            type: string
          type: array
          title: Unsupported
        passive_liveness:
          type: boolean
          title: Passive Liveness
        active_liveness:
          type: boolean
          title: Active Liveness
          description: True only if a tested active provider is available (`active.available`). No such
            provider exists today, so this is false.
        active:
          $ref: '#/components/schemas/ActiveLivenessInfo'
        fusion:
          $ref: '#/components/schemas/FusionPolicyOut'
        challenge:
          $ref: '#/components/schemas/ChallengePolicy'
        input:
          $ref: '#/components/schemas/InputLimits'
        limits:
          $ref: '#/components/schemas/ResourceLimits'
        decision:
          $ref: '#/components/schemas/DecisionPolicy'
        model:
          $ref: '#/components/schemas/ModelInfo'
        face_matching:
          type: boolean
          const: false
          title: Face Matching
          default: false
        image_persistence:
          type: string
          const: none
          title: Image Persistence
          default: none
      type: object
      required:
      - service
      - version
      - ready
      - methods
      - unsupported
      - passive_liveness
      - active_liveness
      - active
      - fusion
      - challenge
      - input
      - limits
      - decision
      - model
      title: CapabilitiesResponse
    CapacityProfileRef:
      properties:
        profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Id
          description: '`profile_id` of the benchmark report (face-liveness-benchmark) the concurrency
            and timeout settings were sized from; null if none was recorded.'
        tested:
          type: boolean
          title: Tested
          description: True if a benchmark profile is referenced.
        auto_tuned:
          type: boolean
          const: false
          title: Auto Tuned
          description: 'Always false: the service never tunes itself.'
          default: false
      type: object
      required:
      - profile_id
      - tested
      title: CapacityProfileRef
    ChallengeEvidence:
      properties:
        challenge_id:
          type: string
          title: Challenge Id
        status:
          type: string
          const: consumed
          title: Status
          description: The challenge was valid, unexpired and unused, and is now spent.
        active_liveness_evaluated:
          type: boolean
          title: Active Liveness Evaluated
          description: 'True only if a tested active provider evaluated the challenge response. No such
            provider is installed today, so this is false: the challenge proves freshness / single use
            only.'
      type: object
      required:
      - challenge_id
      - status
      - active_liveness_evaluated
      title: ChallengeEvidence
    ChallengeInstructionOut:
      properties:
        action:
          type: string
          title: Action
          description: Provider-defined user action, e.g. `turn_head_left`.
        timeout_seconds:
          type: number
          title: Timeout Seconds
      type: object
      required:
      - action
      - timeout_seconds
      title: ChallengeInstructionOut
    ChallengeIssueResponse:
      properties:
        challenge_id:
          type: string
          title: Challenge Id
          description: Opaque, single-use identifier. Treat as a secret; do not log in full.
        challenge_type:
          type: string
          enum:
          - freshness_nonce
          - active_challenge
          title: Challenge Type
          description: '`active_challenge` only when a tested active provider is available; today always
            `freshness_nonce` (freshness / replay prevention only).'
        issued_at:
          type: string
          format: date-time
          title: Issued At
        expires_at:
          type: string
          format: date-time
          title: Expires At
        ttl_seconds:
          type: integer
          title: Ttl Seconds
        instructions:
          items:
            $ref: '#/components/schemas/ChallengeInstructionOut'
          type: array
          title: Instructions
          description: User actions to perform. Empty unless an active provider is available.
        active_liveness:
          type: boolean
          title: Active Liveness
          description: True only if a tested active provider issued instructions. False today.
        authoritative_method:
          type: string
          const: passive_single_image
          title: Authoritative Method
      type: object
      required:
      - challenge_id
      - challenge_type
      - issued_at
      - expires_at
      - ttl_seconds
      - instructions
      - active_liveness
      - authoritative_method
      title: ChallengeIssueResponse
    ChallengePolicy:
      properties:
        supported:
          type: boolean
          const: true
          title: Supported
          default: true
        challenge_type:
          type: string
          enum:
          - freshness_nonce
          - active_challenge
          title: Challenge Type
        ttl_seconds:
          type: integer
          title: Ttl Seconds
        single_use:
          type: boolean
          const: true
          title: Single Use
          default: true
        store:
          type: string
          const: in_process
          title: Store
          description: Verify must reach the replica that issued the challenge.
          default: in_process
        active_liveness:
          type: boolean
          title: Active Liveness
      type: object
      required:
      - challenge_type
      - ttl_seconds
      - active_liveness
      title: ChallengePolicy
    ComponentScoreOut:
      properties:
        name:
          type: string
          title: Name
        live_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Live Score
      type: object
      required:
      - name
      - live_score
      title: ComponentScoreOut
    Decision:
      type: string
      enum:
      - live
      - spoof
      title: Decision
    DecisionEvidence:
      properties:
        model_id:
          type: string
          title: Model Id
        model_version:
          type: string
          title: Model Version
        model_digest:
          type: string
          title: Model Digest
          description: SHA-256 of the active model manifest.
        detector_id:
          type: string
          title: Detector Id
        liveness_type:
          type: string
          const: passive
          title: Liveness Type
          description: Type of the scoring model.
        active_liveness_evaluated:
          type: boolean
          title: Active Liveness Evaluated
          description: True only if active evidence contributed to the decision.
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          description: Ensemble live score that was thresholded.
        score_aggregation:
          type: string
          const: mean_live_probability
          title: Score Aggregation
        threshold:
          type: number
          title: Threshold
        threshold_calibrated:
          type: boolean
          title: Threshold Calibrated
        calibration_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Calibration Id
        margin:
          type: number
          title: Margin
          description: score - threshold.
        policy_id:
          type: string
          title: Policy Id
          description: Versioned fusion policy that produced `decision`.
        evidence_used:
          items:
            $ref: '#/components/schemas/EvidenceKind'
          type: array
          title: Evidence Used
        decision:
          $ref: '#/components/schemas/Decision'
        decision_reason:
          $ref: '#/components/schemas/DecisionReason'
        challenge:
          anyOf:
          - $ref: '#/components/schemas/ChallengeEvidence'
          - type: 'null'
        active:
          anyOf:
          - $ref: '#/components/schemas/ActiveEvidence'
          - type: 'null'
          description: Active provider result; null when none was evaluated.
      type: object
      required:
      - model_id
      - model_version
      - model_digest
      - detector_id
      - liveness_type
      - active_liveness_evaluated
      - score
      - score_aggregation
      - threshold
      - threshold_calibrated
      - calibration_id
      - margin
      - policy_id
      - evidence_used
      - decision
      - decision_reason
      title: DecisionEvidence
      description: 'Bounded, fixed-shape explanation of how the decision was reached.


        Contains identifiers and scalars only: never image bytes, crops, embeddings or tensors.'
    DecisionPolicy:
      properties:
        score:
          type: string
          title: Score
        threshold:
          type: number
          title: Threshold
        threshold_calibrated:
          type: boolean
          title: Threshold Calibrated
        calibration_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Calibration Id
      type: object
      required:
      - score
      - threshold
      - threshold_calibrated
      - calibration_id
      title: DecisionPolicy
    DecisionReason:
      type: string
      enum:
      - score_at_or_above_threshold
      - score_below_threshold
      - all_required_evidence_passed
      - active_challenge_failed
      - active_score_below_minimum
      title: DecisionReason
    EntryStatus:
      type: string
      enum:
      - active
      - candidate
      - installed
      - invalid
      title: EntryStatus
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine-readable error code.
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - code
      - message
      - retryable
      - request_id
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
    EvidenceKind:
      type: string
      enum:
      - passive
      - active
      title: EvidenceKind
    FaceRegion:
      properties:
        x:
          type: integer
          title: X
        y:
          type: integer
          title: Y
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        detection_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Detection Score
      type: object
      required:
      - x
      - y
      - width
      - height
      - detection_score
      title: FaceRegion
    FusionPolicyOut:
      properties:
        policy_id:
          type: string
          title: Policy Id
          description: Explicit, versioned policy id, e.g. `passive-only.v1`.
        strategy:
          anyOf:
          - $ref: '#/components/schemas/FusionStrategy'
          - type: 'null'
        required_evidence:
          items:
            $ref: '#/components/schemas/EvidenceKind'
          type: array
          title: Required Evidence
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        ready:
          type: boolean
          title: Ready
          description: False means every assessment fails closed.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - policy_id
      - strategy
      - required_evidence
      - description
      - ready
      - reason
      title: FusionPolicyOut
    FusionStrategy:
      type: string
      enum:
      - passive_only
      - all_required
      title: FusionStrategy
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    ImageInfo:
      properties:
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        media_type:
          type: string
          title: Media Type
      type: object
      required:
      - width
      - height
      - media_type
      title: ImageInfo
    InputLimits:
      properties:
        formats:
          items:
            type: string
          type: array
          title: Formats
        max_image_bytes:
          type: integer
          title: Max Image Bytes
        max_image_pixels:
          type: integer
          title: Max Image Pixels
        max_image_side_px:
          type: integer
          title: Max Image Side Px
        max_decoded_bytes:
          type: integer
          title: Max Decoded Bytes
        min_image_side_px:
          type: integer
          title: Min Image Side Px
        min_face_size_px:
          type: integer
          title: Min Face Size Px
        faces_required:
          type: integer
          const: 1
          title: Faces Required
