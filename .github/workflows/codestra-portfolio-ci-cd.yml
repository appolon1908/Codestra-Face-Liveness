name: Codestra portfolio CI/CD baseline

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Promotion-readiness environment
        required: true
        default: development
        type: choice
        options:
          - development
          - testing
          - staging
          - production
      release_sha:
        description: Exact commit SHA to certify; blank uses current ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codestra-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact SHA and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          {
            echo "### Codestra CI evidence"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- SHA: ${GITHUB_SHA}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"

  promotion-readiness:
    name: promotion-readiness
    if: github.event_name == 'workflow_dispatch'
    needs: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout requested release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 1
      - name: Certify release identity without deploying
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
          {
            echo "### Promotion-readiness evidence"
            echo "- Target: $TARGET_ENVIRONMENT"
            echo "- Certified SHA: $actual"
            echo "- Live deployment performed: no"
          } >> "${GITHUB_STEP_SUMMARY}"
