name: Documentation and contract source scope
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation-contract-source:
    name: documentation-contract-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate documentation, contract semantics and fail-closed source scope
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r .github/requirements-source-scope.txt
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/validate_source_scope.py
      - name: Scan complete effective tree and tracked history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact=100 --exit-code 1 .
