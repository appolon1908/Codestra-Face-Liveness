name: Codestra hierarchy governance
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  hierarchy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion path
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          valid=0
          case "$HEAD_REF:$BASE_REF" in
            subworkstation/*:workstation/*) valid=1 ;;
            subsection/*:workstation/*) valid=1 ;;
            workstation/*:development) valid=1 ;;
            development:testing) valid=1 ;;
            testing:staging) valid=1 ;;
            staging:production) valid=1 ;;
          esac
          if [ "$valid" -ne 1 ]; then
            echo "::error::Invalid promotion path: $HEAD_REF -> $BASE_REF"
            exit 1
          fi
